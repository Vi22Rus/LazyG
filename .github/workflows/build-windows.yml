name: Build LazyG Windows EXE

on:
  push:
    branches: [main]
    paths:
      - 'LazyG/Windows/**'
      - 'LazyG/AddonTemplate/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained single EXE
        shell: pwsh
        run: |
          dotnet publish LazyG/Windows/LazyG.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -o "$env:RUNNER_TEMP\LazyG-publish"
          if (-not (Test-Path "$env:RUNNER_TEMP\LazyG-publish\LazyG.exe")) {
            throw "LazyG.exe was not generated"
          }
          New-Item -ItemType Directory -Force -Path "release" | Out-Null
          Copy-Item "$env:RUNNER_TEMP\LazyG-publish\LazyG.exe" "release\LazyG.exe"

      - name: Smoke test Windows startup
        shell: pwsh
        run: |
          $exe = Join-Path (Get-Location) "release\LazyG.exe"
          $log = Join-Path $env:LOCALAPPDATA "LazyG\startup-error.log"
          if (Test-Path $log) { Remove-Item $log -Force }
          $app = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 6
          $app.Refresh()
          if ($app.HasExited) {
            if (Test-Path $log) { Get-Content $log }
            throw "LazyG.exe exited during startup (exit code $($app.ExitCode))."
          }
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue

      - name: Upload ready-to-download EXE
        uses: actions/upload-artifact@v4
        with:
          name: LazyG-Windows-x64
          path: release/LazyG.exe
          if-no-files-found: error
          retention-days: 30
