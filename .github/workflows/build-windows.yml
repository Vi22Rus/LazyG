name: Build LazyG Windows EXE

on:
  push:
    branches: [main]
    paths:
      - 'LazyG/Windows/**'
      - 'LazyG/Avalonia/**'
      - 'LazyG/AddonTemplate/**'
      - 'LazyG/Tests/**'
      - 'LazyG/Diagnostics/LazyGForeverProbe/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify RGB v3 codec reference vectors
        shell: pwsh
        run: dotnet run --project LazyG/Tests/RgbV3CodecTests.csproj -c Release

      - name: Verify GameState tri-state safety regression
        shell: pwsh
        run: dotnet run --project LazyG/Tests/GameStateTests.csproj -c Release

      - name: Verify rotation v2 schema, simulator and provider safety
        shell: pwsh
        run: dotnet run --project LazyG/Tests/RotationFoundationTests.csproj -c Release

      - name: Verify embedded Forever spell atlas and bilingual mapping
        shell: pwsh
        run: python LazyG/Tests/test_spell_assets.py

      - name: Publish self-contained single EXE
        shell: pwsh
        run: |
          dotnet publish LazyG/Avalonia/LazyG.Avalonia.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o "$env:RUNNER_TEMP\LazyG-publish"
          if (-not (Test-Path "$env:RUNNER_TEMP\LazyG-publish\LazyG.exe")) {
            throw "LazyG.exe was not generated"
          }
          New-Item -ItemType Directory -Force -Path "release" | Out-Null
          Copy-Item "$env:RUNNER_TEMP\LazyG-publish\LazyG.exe" "release\LazyG.exe"

      - name: Smoke test Windows startup
        shell: pwsh
        run: |
          $exe = Join-Path (Get-Location) "release\LazyG.exe"
          $log = Join-Path $env:LOCALAPPDATA "LazyG\startup-error.log"
          if (Test-Path $log) { Remove-Item $log -Force }
          $app = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 6
          $app.Refresh()
          if ($app.HasExited) {
            if (Test-Path $log) { Get-Content $log }
            Write-Host "Windows Application event log (recent errors):"
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-5); Level = 2 } -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -match 'Application Error|\.NET Runtime|Windows Error Reporting' -or $_.Message -match 'LazyG' } |
              Select-Object -First 12 TimeCreated, ProviderName, Id, Message |
              Format-List | Out-String -Width 220 | Write-Host
            throw "LazyG.exe exited during startup (exit code $($app.ExitCode))."
          }
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue

      - name: Upload ready-to-download EXE
        uses: actions/upload-artifact@v4
        with:
          name: LazyG-Windows-x64
          path: release/LazyG.exe
          if-no-files-found: error
          retention-days: 30

      - name: Package optional Forever diagnostic addon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release-addon/LazyGForeverProbe" | Out-Null
          Copy-Item "LazyG/Diagnostics/LazyGForeverProbe/*.lua" "release-addon/LazyGForeverProbe/"
          Copy-Item "LazyG/Diagnostics/LazyGForeverProbe/*.toc" "release-addon/LazyGForeverProbe/"
          if (-not (Test-Path "release-addon/LazyGForeverProbe/CooldownAudit.lua")) {
            throw "CooldownAudit.lua missing from addon artifact"
          }

      - name: Upload ready-to-install Forever diagnostic addon
        uses: actions/upload-artifact@v4
        with:
          name: LazyGForeverProbe-0.4.0-dev
          path: release-addon/
          if-no-files-found: error
          retention-days: 30

  lua-codec:
    name: Lua 5.1 wire encoder regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Verify Lua 5.1 syntax for both RGB v3 modules
        run: |
          luac5.1 -p LazyG/AddonTemplate/RgbV3Encoder.lua
          luac5.1 -p LazyG/AddonTemplate/HunterCompactProfileEncoder.lua
          luac5.1 -p LazyG/AddonTemplate/HunterCompactManifest.lua
          luac5.1 -p LazyG/AddonTemplate/RgbV3Panel.lua
          luac5.1 -p LazyG/AddonTemplate/RgbV3Thresholds.lua
          luac5.1 -p LazyG/Diagnostics/LazyGForeverProbe/CooldownAudit.lua
          luac5.1 -p LazyG/Diagnostics/LazyGForeverProbe/CooldownStateProbe.lua
          luac5.1 -p LazyG/Diagnostics/LazyGForeverProbe/CooldownWatch.lua
          luac5.1 -p LazyG/Diagnostics/LazyGForeverProbe/CooldownRgb.lua
          luac5.1 -p LazyG/Diagnostics/LazyGForeverProbe/LazyGForeverProbe.lua
          luac5.1 -p LazyG/Diagnostics/LazyGForeverProbe/CastEventRgb.lua
          luac5.1 -p LazyG/Diagnostics/LazyGForeverProbe/SpellDiagnosticRgb.lua
      - name: Verify opt-in Forever LGE player-cast event protocol
        run: lua5.1 LazyG/Tests/forever_cast_event_rgb_test.lua

      - name: Verify Lua RGB v3 wire vectors
        run: lua5.1 LazyG/Tests/rgb_v3_encoder_test.lua

      - name: Verify compact Hunter v3 extension shared Lua/C# fixture
        run: lua5.1 LazyG/Tests/hunter_compact_profile_test.lua

      - name: Verify Forever cooldown audit behavior
        run: lua5.1 LazyG/Tests/forever_cooldown_audit_test.lua

      - name: Verify Forever cooldown state and widget experiment
        run: lua5.1 LazyG/Tests/forever_cooldown_state_test.lua

      - name: Verify automatic 30-second cooldown observer
        run: lua5.1 LazyG/Tests/forever_cooldown_watch_test.lua

      - name: Verify Forever cooldown RGB v1 wire vectors
        run: lua5.1 LazyG/Tests/forever_cooldown_rgb_test.lua

      - name: Verify LGC explicit opt-in restores on addon reload
        run: lua5.1 LazyG/Tests/forever_cooldown_rgb_reload_test.lua

      - name: Verify unified optional RGB diagnostics commands and settings
        run: lua5.1 LazyG/Tests/forever_rgb_diagnostics_test.lua

      - name: Verify LGD selectable spell and GCD quality RGB
        run: lua5.1 LazyG/Tests/forever_spell_rgb_test.lua
