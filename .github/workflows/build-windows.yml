name: Build LazyG Windows Connector EXE (DEV)

on:
  push:
    branches: [main, experiment/lazygcore]
    paths:
      - 'LazyG/Windows/**'
      - 'LazyG/Avalonia/**'
      - 'LazyG/Tests/RgbV3CodecTests.csproj'
      - 'LazyG/Tests/Program.cs'
      - 'LazyG/Tests/test_spell_assets.py'
      - 'LazyG/Experiments/LazyGConnector/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify RGB v3 codec reference vectors
        shell: pwsh
        run: dotnet run --project LazyG/Tests/RgbV3CodecTests.csproj -c Release

      - name: Verify embedded Forever spell atlas and bilingual mapping
        shell: pwsh
        run: python LazyG/Tests/test_spell_assets.py

      - name: Publish self-contained single EXE
        shell: pwsh
        run: |
          dotnet publish LazyG/Avalonia/LazyG.Avalonia.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o "$env:RUNNER_TEMP\LazyG-publish"
          if (-not (Test-Path "$env:RUNNER_TEMP\LazyG-publish\LazyG.exe")) {
            throw "LazyG.exe was not generated"
          }
          New-Item -ItemType Directory -Force -Path "release" | Out-Null
          Copy-Item "$env:RUNNER_TEMP\LazyG-publish\LazyG.exe" "release\LazyG.exe"

      - name: Smoke test Windows startup
        shell: pwsh
        run: |
          $exe = Join-Path (Get-Location) "release\LazyG.exe"
          $log = Join-Path $env:LOCALAPPDATA "LazyG\startup-error.log"
          if (Test-Path $log) { Remove-Item $log -Force }
          $app = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 6
          $app.Refresh()
          if ($app.HasExited) {
            if (Test-Path $log) { Get-Content $log }
            Write-Host "Windows Application event log (recent errors):"
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-5); Level = 2 } -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -match 'Application Error|\.NET Runtime|Windows Error Reporting' -or $_.Message -match 'LazyG' } |
              Select-Object -First 12 TimeCreated, ProviderName, Id, Message |
              Format-List | Out-String -Width 220 | Write-Host
            throw "LazyG.exe exited during startup (exit code $($app.ExitCode))."
          }
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue

      - name: Upload ready-to-download EXE
        uses: actions/upload-artifact@v4
        with:
          name: LazyG-Windows-x64
          path: release/LazyG.exe
          if-no-files-found: error
          retention-days: 30

  connector-lua:
    name: External JustAC/Hekili Lua connector smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Check native connector source and provider adapters
        run: |
          luac5.1 -p LazyG/Experiments/LazyGConnector/LazyGConnector/Connector.lua
          luac5.1 -p LazyG/Experiments/LazyGConnector/LazyGConnector/NativeBindings.lua
          lua5.1 LazyG/Experiments/LazyGConnector/tests/provider_smoke.lua
